name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/transaction-drilldowns-20261024]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner includes the Android SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo "Android 35 platform will be downloaded by Gradle if required"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        env:
          MIB_RELEASE_KEY_BASE64: ${{ secrets.MIB_RELEASE_KEY_BASE64 }}
          MIB_RELEASE_STORE_PASSWORD: ${{ secrets.MIB_RELEASE_STORE_PASSWORD }}
          MIB_RELEASE_KEY_ALIAS: ${{ secrets.MIB_RELEASE_KEY_ALIAS }}
          MIB_RELEASE_KEY_PASSWORD: ${{ secrets.MIB_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$MIB_RELEASE_KEY_BASE64" ] || [ -z "$MIB_RELEASE_STORE_PASSWORD" ] || [ -z "$MIB_RELEASE_KEY_ALIAS" ] || [ -z "$MIB_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Configure all four MIB_RELEASE_* GitHub Actions secrets before building."
            exit 1
          fi
          printf '%s' "$MIB_RELEASE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/mib-release.jks"
          chmod 600 "$RUNNER_TEMP/mib-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mib-release.jks" -storepass "$MIB_RELEASE_STORE_PASSWORD" -alias "$MIB_RELEASE_KEY_ALIAS" >/dev/null
          echo "MIB_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/mib-release.jks" >> "$GITHUB_ENV"
      - name: Run unit tests and compile checks
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build signed release APK
        env:
          MIB_RELEASE_STORE_PASSWORD: ${{ secrets.MIB_RELEASE_STORE_PASSWORD }}
          MIB_RELEASE_KEY_ALIAS: ${{ secrets.MIB_RELEASE_KEY_ALIAS }}
          MIB_RELEASE_KEY_PASSWORD: ${{ secrets.MIB_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify update compatibility with previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download build-171 --repo "$GITHUB_REPOSITORY" --pattern MIBBudgetTracker.apk --dir "$RUNNER_TEMP/previous-release"
          python3 - <<'PY'
          import glob, os, re, subprocess
          tools = sorted(glob.glob(os.path.join(os.environ["ANDROID_HOME"], "build-tools", "*", "apksigner")))[-1]
          aapt = os.path.join(os.path.dirname(tools), "aapt")
          old = os.path.join(os.environ["RUNNER_TEMP"], "previous-release", "MIBBudgetTracker.apk")
          new = "app/build/outputs/apk/release/app-release.apk"
          def inspect(path):
              signature = subprocess.check_output([tools, "verify", "--print-certs", path], text=True)
              certs = re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F]{64})", signature)
              assert certs, "No signing certificate found"
              info = subprocess.check_output([aapt, "dump", "badging", path], text=True)
              package = re.search(r"package: name='([^']+)' versionCode='(\d+)'", info)
              assert package, "No package metadata found"
              return sorted(set(certs)), package.group(1), int(package.group(2))
          old_cert, old_package, old_version = inspect(old)
          new_cert, new_package, new_version = inspect(new)
          assert old_cert == new_cert, "Signing certificates differ; do not distribute this APK as an update"
          assert old_package == new_package == "com.example.mibbudget", "Package identity changed"
          assert new_version > old_version, "Update version must exceed previous release"
          print(f"Verified matching release certificate and package; version {old_version} -> {new_version}")
          PY
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MIBBudgetTracker-update.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MIBBudgetTracker-signed-update
          path: app/build/outputs/apk/release/MIBBudgetTracker-update.apk

      - name: Publish installable APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MIBBudgetTracker.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" MIBBudgetTracker.apk \
            --title "MIB Budget Tracker build ${GITHUB_RUN_NUMBER}" \
            --notes "Install this APK over the previous version. Keep the existing app installed to preserve local data." \
            --latest
