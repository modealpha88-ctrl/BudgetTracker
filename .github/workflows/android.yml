name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner includes the Android SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo "Android 35 platform will be downloaded by Gradle if required"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent APK signing key
        env:
          MIB_SIGNING_KEY_BASE64: ${{ secrets.MIB_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$MIB_SIGNING_KEY_BASE64" ]; then
            echo "::error::Add MIB_SIGNING_KEY_BASE64 in repository Settings > Secrets and variables > Actions before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf "%s" "$MIB_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MIBBudgetTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish installable APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MIBBudgetTracker.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" MIBBudgetTracker.apk \
            --title "MIB Budget Tracker build ${GITHUB_RUN_NUMBER}" \
            --notes "Install this APK over the previous version. Keep the existing app installed to preserve local data." \
            --latest
