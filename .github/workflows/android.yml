name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner includes the Android SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo "Android 35 platform will be downloaded by Gradle if required"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        env:
          MIB_RELEASE_KEY_BASE64: ${{ secrets.MIB_RELEASE_KEY_BASE64 }}
          MIB_RELEASE_STORE_PASSWORD: ${{ secrets.MIB_RELEASE_STORE_PASSWORD }}
          MIB_RELEASE_KEY_ALIAS: ${{ secrets.MIB_RELEASE_KEY_ALIAS }}
          MIB_RELEASE_KEY_PASSWORD: ${{ secrets.MIB_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$MIB_RELEASE_KEY_BASE64" ] || [ -z "$MIB_RELEASE_STORE_PASSWORD" ] || [ -z "$MIB_RELEASE_KEY_ALIAS" ] || [ -z "$MIB_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Configure all four MIB_RELEASE_* GitHub Actions secrets before building."
            exit 1
          fi
          printf '%s' "$MIB_RELEASE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/mib-release.jks"
          chmod 600 "$RUNNER_TEMP/mib-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mib-release.jks" -storepass "$MIB_RELEASE_STORE_PASSWORD" -alias "$MIB_RELEASE_KEY_ALIAS" >/dev/null
          echo "MIB_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/mib-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          MIB_RELEASE_STORE_PASSWORD: ${{ secrets.MIB_RELEASE_STORE_PASSWORD }}
          MIB_RELEASE_KEY_ALIAS: ${{ secrets.MIB_RELEASE_KEY_ALIAS }}
          MIB_RELEASE_KEY_PASSWORD: ${{ secrets.MIB_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MIBBudgetTracker-release-apk
          path: app/build/outputs/apk/release/*-release.apk

      - name: Publish installable APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MIBBudgetTracker.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" MIBBudgetTracker.apk \
            --title "MIB Budget Tracker build ${GITHUB_RUN_NUMBER}" \
            --notes "Install this APK over the previous version. Keep the existing app installed to preserve local data." \
            --latest
