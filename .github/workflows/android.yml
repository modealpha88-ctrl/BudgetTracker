name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner includes the Android SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo "Android 35 platform will be downloaded by Gradle if required"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        env:
          MIB_RELEASE_KEY_BASE64: ${{ secrets.MIB_RELEASE_KEY_BASE64 }}
          MIB_RELEASE_STORE_PASSWORD: ${{ secrets.MIB_RELEASE_STORE_PASSWORD }}
          MIB_RELEASE_KEY_ALIAS: ${{ secrets.MIB_RELEASE_KEY_ALIAS }}
          MIB_RELEASE_KEY_PASSWORD: ${{ secrets.MIB_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$MIB_RELEASE_KEY_BASE64" ] || [ -z "$MIB_RELEASE_STORE_PASSWORD" ] || [ -z "$MIB_RELEASE_KEY_ALIAS" ] || [ -z "$MIB_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Configure all four MIB_RELEASE_* GitHub Actions secrets before building."
            exit 1
          fi
          printf '%s' "$MIB_RELEASE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/mib-release.jks"
          chmod 600 "$RUNNER_TEMP/mib-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mib-release.jks" -storepass "$MIB_RELEASE_STORE_PASSWORD" -alias "$MIB_RELEASE_KEY_ALIAS" >/dev/null
          echo "MIB_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/mib-release.jks" >> "$GITHUB_ENV"
      - name: Run unit tests and compile checks
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build signed release APK
        env:
          MIB_RELEASE_STORE_PASSWORD: ${{ secrets.MIB_RELEASE_STORE_PASSWORD }}
          MIB_RELEASE_KEY_ALIAS: ${{ secrets.MIB_RELEASE_KEY_ALIAS }}
          MIB_RELEASE_KEY_PASSWORD: ${{ secrets.MIB_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK archive, signature, and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          # Verify every compressed entry, including native OCR libraries.
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK" | tee apk.sha256

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BudgetTracker-release-apk
          path: |
            app/build/outputs/apk/release/*-release.apk
            apk.sha256

      - name: Publish installable APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk BudgetTracker.apk
          sha256sum BudgetTracker.apk | tee BudgetTracker.apk.sha256
          unzip -t BudgetTracker.apk >/dev/null
          gh release create "build-${GITHUB_RUN_NUMBER}" BudgetTracker.apk BudgetTracker.apk.sha256 \
            --title "Budget Tracker build ${GITHUB_RUN_NUMBER}" \
            --notes "Install this APK over the previous version. Keep the existing app installed to preserve local data." \
            --latest
